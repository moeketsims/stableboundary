name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Editable development bootstrap
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Strict type check
        run: python -m mypy src
      - name: Ordinary tests
        run: python -m pytest -q -m "not installed"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Inspect wheel contents
        run: python -m check_wheel_contents dist/*.whl
      - name: Install and exercise both archives
        run: python -m pytest -q tests/test_installed_package.py -m installed
