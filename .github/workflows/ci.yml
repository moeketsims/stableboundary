name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Latest / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Editable development bootstrap
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Strict type check
        run: python -m mypy
      - name: Ordinary tests with branch coverage
        run: python -m coverage run --branch -m pytest -q -m "not installed"
      - name: Enforce branch coverage floor
        run: python -m coverage report --fail-under=80
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Inspect wheel contents
        run: python -m check_wheel_contents dist/*.whl
      - name: Install and exercise both archives
        run: python -m pytest -q tests/test_installed_package.py -m installed

  minimum:
    name: Minimum runtime dependencies / Linux / Python 3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared minima and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.0" "scipy==1.18.0"
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Prove minimum versions were retained
        run: >-
          python -c "import numpy, scipy;
          assert numpy.__version__ == '2.2.0', numpy.__version__;
          assert scipy.__version__ == '1.18.0', scipy.__version__"
      - name: Minimum-version tests with branch coverage
        run: python -m coverage run --branch -m pytest -q -m "not installed"
      - name: Enforce branch coverage floor
        run: python -m coverage report --fail-under=80
      - name: Build and validate metadata
        run: |
          python -m build
          python -m twine check dist/*
          python -m check_wheel_contents dist/*.whl

  locked:
    name: Locked developer environment / Linux / Python 3.13
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install uv frontend
        run: python -m pip install "uv==0.12.5"
      - name: Sync exactly the committed lock
        run: uv sync --extra dev --locked
      - name: Locked lint, formatting, and types
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
      - name: Locked tests with branch coverage
        run: >-
          uv run --frozen coverage run --branch
          --source=stableboundary,scripts
          -m pytest -q -m "not installed"
      - name: Independent oracle regeneration check
        run: >-
          uv run --frozen coverage run --branch
          --source=scripts --append
          scripts/generate_artifact_oracle.py
          --check scripts/artifact_oracle.json
      - name: Enforce package and verifier branch coverage floors
        run: |
          uv run --frozen coverage report --include='src/stableboundary/*' --fail-under=80
          uv run --frozen coverage report --include='scripts/*' --fail-under=80
      - name: Locked build and metadata validation
        run: |
          uv run --frozen python -m build --no-isolation
          uv run --frozen twine check dist/*
          uv run --frozen check-wheel-contents dist/*.whl
      - name: Ordinary pip sdist install compatibility (locked Linux)
        shell: bash
        run: |
          sdist="$(find dist -maxdepth 1 -type f -name 'stableboundary-*.tar.gz' -print -quit)"
          test -n "$sdist"
          sdist="$(realpath "$sdist")"
          install_root="$(mktemp -d)"
          outside_checkout="$(mktemp -d)"
          trap 'rm -rf "$install_root" "$outside_checkout"' EXIT
          python -m venv "$install_root/venv"
          "$install_root/venv/bin/python" -m pip --isolated install \
            --disable-pip-version-check --no-input "$sdist"
          "$install_root/venv/bin/python" -m pip --isolated check
          (
            cd "$outside_checkout"
            STABLEBOUNDARY_CHECKOUT="$GITHUB_WORKSPACE" \
              "$install_root/venv/bin/python" -c \
              "import os; from pathlib import Path; import stableboundary; package_file = Path(stableboundary.__file__).resolve(); assert Path(os.environ['STABLEBOUNDARY_CHECKOUT']).resolve() not in package_file.parents, package_file; print(package_file)"
          )
